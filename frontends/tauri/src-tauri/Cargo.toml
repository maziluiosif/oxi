[package]
name = "oxi-tauri"
version = "0.1.0"
edition = "2024"
description = "oxi desktop app on Tauri, a client of `oxi headless`"
license = "MIT"

# Its own workspace: the oxi crate at the repository root doesn't build this.
[workspace]

[lib]
name = "oxi_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
dirs = "6"
log = "0.4"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
