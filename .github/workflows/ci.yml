name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]
  # The release workflow dispatches CI explicitly for its bot-created master -> dev PR.
  workflow_dispatch:
    inputs:
      ref:
        description: Commit/ref to validate instead of the selected workflow ref
        required: false
        type: string

# A new push to a pull request supersedes the run for its previous commit. Branch pushes and
# dispatched runs are never cancelled: releases depend on them completing.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # Required status check on dev: keep the job id `ci`.
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Validate GitHub Actions workflows
        uses: raven-actions/actionlint@v2

      - name: Test release changelog generator
        run: python .github/scripts/test_release_changelog.py

      - name: Validate shell scripts
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          scripts = sorted(Path(".").rglob("*.sh"))
          crlf = [str(path) for path in scripts if b"\r" in path.read_bytes()]
          if crlf:
              raise SystemExit("Shell scripts must use LF line endings: " + ", ".join(crlf))
          PY
          find . -type f -name '*.sh' -not -path './.git/*' -exec bash -n {} +

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # Prebuilt binary: compiling cargo-audit from source took ~3 minutes per run.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        # Ignore policy (with rationale per advisory) lives in .cargo/audit.toml.
        run: cargo audit

  # macOS is the primary desktop target and carries platform-only code (window chrome,
  # keychain, bundling); check it here instead of first compiling it in a release build.
  macos-check:
    name: macos-check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

  windows-check:
    name: windows-check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-check

      # Lint the cfg(windows) code too, so platform-specific warnings can't reach a release.
      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings
